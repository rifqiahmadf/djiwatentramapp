name: Validate web applications
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Audit configuration
        run: node scripts/audit-env-config.mjs
      - name: Test application and deployment configuration
        run: |
          node scripts/test-with-env.mjs packages/env packages/config packages/djiwapay-core apps/customer apps/auth-server apps/admin apps/pos apps/b2b apps/merchandise apps/djiwapay packages/yumipos-web-shared workers/booking-notifications
          bun test scripts/check-build-env.test.ts scripts/prepare-deployment-env.test.ts
      - name: Check workspace types
        run: bun run check-types
      - name: Compile all web applications with CI fixtures
        run: node scripts/check-web-builds.mjs
